/* ---------- UI: thẻ lựa chọn, chip chỉ số ---------- */
const STAT={cash:{n:'Tiền',ic:'money'},energy:{n:'Năng lượng',ic:'bolt'},health:{n:'Sức khỏe',ic:'heart'},social:{n:'Thần thái',ic:'smile'},hunger:{n:'Độ đói',ic:'bowl',inv:1},bossTrust:{n:'Tin tưởng của sếp',ic:'boss'},coworkerTrust:{n:'Đồng nghiệp',ic:'smile'},phoneBattery:{n:'Pin điện thoại',ic:'phone'}};
const kfmt=v=>{const a=Math.abs(v);return (v<0?'-':'+')+(a>=1000?(Math.round(a/100)/10).toString().replace('.0','')+'K':a)};
function chipsOf(c){
  const out=[];const net=(c.fx.cash||0)-c.cost;if(net)out.push({k:'cash',v:net,t:kfmt(net)});
  const rest=['energy','health','social','bossTrust','hunger'].filter(k=>c.fx[k]).map(k=>({k,v:c.fx[k],t:(c.fx[k]>0?'+':'')+c.fx[k]})).sort((a,b)=>Math.abs(b.v)-Math.abs(a.v));
  return out.concat(rest)}
function chipCol(k,v){const good=STAT[k].inv?v<0:v>0;return good?'#14925a':'#d6304a'}
function drawChips(chips,xr,y,h){chips.forEach((ch,i)=>{const cy=y+Math.round((i+.5)*h/chips.length),col=chipCol(ch.k,ch.v),w=mw(ch.t,20);
  T(ch.t,xr,cy,20,col,'right');const ic=STAT[ch.k].ic;spr(ic,xr-w-sw(ic,2)-6,cy-Math.floor(sh(ic,2)/2),2)})}
function card(x,y,w,h,num,title,hint,chips,enabled,hl,act){
  const hv=enabled&&isHover(x,y),fill=!enabled?'#d9d4c8':(hv||hl)?'#ffe27d':'#fff4d9';

  panel(x+8,y+Math.floor((h-34)/2),34,34,enabled?'#ffd438':'#b9b5ab','#2a2036',{n:4});T(String(num),x+25,y+Math.floor(h/2),26,'#2a2036','center');
  const tw=w-64-(chips.length?78:0),hasHint=!!hint;
  let fs=17,rows=lines(title,tw,fs);
  while(rows.length>2&&fs>13){fs--;rows=lines(title,tw,fs)}
  const lh=fs+3,canHint=hasHint&&rows.length<=2&&h>=67;
  const blockH=rows.length*lh+(canHint?17:0),firstY=y+(h-blockH)/2+lh/2;
  rows.forEach((r,i)=>T(r,x+52,firstY+i*lh,fs,enabled?'#2a2036':'#85838b'));
  if(canHint)T(hint,x+52,firstY+rows.length*lh+2,12,enabled?'#946526':'#b45d65','left',null,tw);
  if(chips.length)drawChips(chips.slice(0,h>=72?3:2),x+w-12,y+8,h-16);
  if(hv)spr('hand',x+w-34,y+h-26,3);
  if(enabled)addHit(x,y,w,h,act)}

    mk(346,52,'CHƠI LẠI','Bắt đầu một ngày mới',true,()=>{s=base();s.phase='setupProfile';save()});
    mk(404,36,'SAO CHÉP KẾT QUẢ','',false,()=>{const text='100K – Sống sót 24 giờ\n'+e[0]+'\n💵 '+money(s.cash)+' · ⚡ '+s.energy+' · ❤️ '+s.health;navigator.clipboard?.writeText?.(text).catch(()=>window.prompt('Sao chép:',text))||window.prompt('Sao chép:',text)})}}

 const X=592,Wd=350;

/* ---------- vẽ toàn bộ ---------- */
function render(){
  hit.length=0;ctx.clearRect(0,0,W,H);ctx.imageSmoothingEnabled=false;
  const idx=Math.min(s.index,CFG.length-1),ev=events[idx];
  drawScene(idx,frame);
  // bong bóng thoại
  let msg,tailX,bx,bw=350,bottom;
  if(s.phase==='setupProfile'){msg='Mỗi nhân viên đều có một xuất phát điểm khác nhau. Hôm nay bạn là ai?'}
  else if(s.phase==='setupFocus'){msg='Bạn có 100.000 đồng và một ngày dài. Điều gì quan trọng nhất?'}
  else if(s.phase==='result'){msg=s.last.outcome.msg}
  else if(s.phase==='end'){msg=ending()[1]}
  else{msg=typeof ev.desc==='function'?ev.desc():ev.desc}
  if(CFG[idx].boss){bx=232;tailX=348;bottom=222}else{bx=110;tailX=236;bottom=236}
  drawBanner(ev);bubble(msg,bx,bottom,bw,tailX);
  drawRight(ev);drawTimeline();drawHUD();
  if(ui)drawModal()}

function pos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
const hitAt=p=>{for(let i=hit.length-1;i>=0;i--){const b=hit[i];if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h)return b}return null};
canvas.addEventListener('pointerdown',e=>{const h=hitAt(pos(e));if(h){h.action();render()}});
canvas.addEventListener('pointermove',e=>{const h=hitAt(pos(e));hoverKey=h?h.key:'';canvas.style.cursor=h&&h.w<W?'pointer':'default'});
canvas.addEventListener('pointerleave',()=>{hoverKey=''});
addEventListener('keydown',e=>{
  if(e.key==='Escape'){ui=null;render();return}
  if(ui)return;
  if((s.phase==='setupProfile'||s.phase==='setupFocus')&&/^[1-4]$/.test(e.key)){const idx=+e.key-1;if(s.phase==='setupProfile')initProfile(PROFILES[idx].id);else initFocus(FOCUSES[idx].id)}
  else if(s.phase==='choice'&&/^[1-9]$/.test(e.key)){const c=events[s.index].choices()[+e.key-1];if(c&&valid(c)){choose(c.id);save();render()}}
  else if(s.phase==='result'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();advance();save();render()}});
try{let old=JSON.parse(localStorage.getItem(saveKey)||'null');if(old&&Number.isInteger(old.index)&&old.index>=0&&old.index<events.length&&['choice','result','end','setupProfile','setupFocus'].includes(old.phase)){s={...base(),...old,npc:{...base().npc,...old.npc}};if(s.phase==='result'&&!s.last?.outcome)s.phase='choice'}}catch(e){}
function save(){try{localStorage.setItem(saveKey,JSON.stringify(s))}catch(e){}}
if(!s.profileId&&s.phase==='choice')s.phase='setupProfile';
render();
const startLoop=()=>{tcache.clear();render()};
if(document.fonts?.ready)document.fonts.ready.then(startLoop)
setInterval(()=>{frame++;render()},100);
